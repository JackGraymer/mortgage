[project]
site_url = "https://buying-house-ch.jackgraymer.workers.dev/"
site_name = "Buying a House in Switzerland"
site_description = "A practical, self-contained guide to buying residential property in Switzerland (Zurich and Aargau focus): legal rules, mortgages, taxes, costs and purchase process, plus built-in calculators."
site_author = "Alvaro Cervan"
copyright = "&copy; 2026 Alvaro Cervan"

nav = [
  { "Home" = "index.md" },
  { "Guide" = [
      { "Overview" = "overview.md" },
      { "Legal & Eligibility" = "legal/index.md" },
      { "Financing & Mortgages" = "financing/index.md" },
      { "Banking & Lenders" = "banking.md" },
      { "Taxation" = "taxation/index.md" },
      { "Purchase Process" = "process.md" },
      { "Costs & Fees" = "costs.md" },
      { "Checklist" = "checklist.md" },
      { "Sources" = "sources.md" },
  ] },
  { "Tools" = [
      { "Amortization Calculator" = "financing/calculator.md" },
      { "Tax Estimator" = "taxation/calculator.md" },
  ] },
]

extra_css = ["stylesheets/extra.css"]
extra_javascript = ["https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"]

[project.extra]
generator = false

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.plugins.markdown-exec]

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
